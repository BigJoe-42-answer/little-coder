<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- little-coder (base): the fork's banner motif — warm-black terminal card,
       cream "lc" monogram, honey block cursor. Palette from assets/banner.svg:
       card #1A1410, paper #F2EBDC, honey #E15A1F. -->
  <rect x="16" y="16" width="224" height="224" rx="40" fill="#1A1410"/>
  <!-- title bar: first dot honey, rest dim paper (banner title bar) -->
  <circle cx="52" cy="58" r="7" fill="#E15A1F"/>
  <circle cx="76" cy="58" r="7" fill="#F2EBDC" opacity="0.25"/>
  <circle cx="100" cy="58" r="7" fill="#F2EBDC" opacity="0.25"/>
  <line x1="30" y1="80" x2="226" y2="80" stroke="#F2EBDC" stroke-opacity="0.12" stroke-width="2"/>
  <!-- lc monogram + honey block cursor -->
  <text x="52" y="186" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace"
        font-size="112" font-weight="700" letter-spacing="-4" fill="#F2EBDC">lc</text>
  <rect x="158" y="106" width="34" height="84" fill="#E15A1F"/>
</svg>
