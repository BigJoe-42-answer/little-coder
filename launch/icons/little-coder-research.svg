<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- little-coder research: the base (vivid honey-on-dark) theme with a
       searching modification — a honey magnifier over the corner, its lens
       holding a small prompt caret. Same card/monogram/cursor as the base
       icon so the family reads at a glance. -->
  <rect x="16" y="16" width="224" height="224" rx="40" fill="#1A1410"/>
  <circle cx="52" cy="58" r="7" fill="#E15A1F"/>
  <circle cx="76" cy="58" r="7" fill="#F2EBDC" opacity="0.25"/>
  <circle cx="100" cy="58" r="7" fill="#F2EBDC" opacity="0.25"/>
  <line x1="30" y1="80" x2="226" y2="80" stroke="#F2EBDC" stroke-opacity="0.12" stroke-width="2"/>
  <!-- monogram shifted left to leave room for the magnifier -->
  <text x="44" y="180" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace"
        font-size="100" font-weight="700" letter-spacing="-4" fill="#F2EBDC">lc</text>
  <rect x="142" y="104" width="30" height="78" fill="#E15A1F"/>
  <!-- magnifier: honey ring + handle, lens tinted paper with a caret inside -->
  <circle cx="182" cy="176" r="36" fill="#1A1410" stroke="#E15A1F" stroke-width="10"/>
  <circle cx="182" cy="176" r="36" fill="#F2EBDC" opacity="0.08"/>
  <line x1="207" y1="201" x2="230" y2="224" stroke="#E15A1F" stroke-width="13" stroke-linecap="round"/>
  <text x="168" y="192" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace"
        font-size="36" font-weight="700" fill="#E15A1F">&gt;</text>
</svg>
